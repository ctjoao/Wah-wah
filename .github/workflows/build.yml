name: Build Solo Wah (VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-15-intel
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target SoloWah_VST3 --parallel

      - name: Collect plug-in
        shell: bash
        run: |
          mkdir -p dist
          find build -type d -name "Solo Wah.vst3" -exec cp -R {} dist/ \;
          ls -R dist | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: SoloWah-VST3-${{ matrix.name }}
          path: dist

  release:
    name: Publish download page
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform
        run: |
          mkdir -p out
          for d in artifacts/*/; do
            n=$(basename "$d")
            (cd "$d" && zip -qr "../../out/$n.zip" .)
          done
          ls -la out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest out/*.zip --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Solo Wah VST3 (latest build)" \
            --notes "Download the zip for your system, unzip it, and copy Solo Wah.vst3 into your VST3 folder. macOS users: SoloWah-VST3-macOS.zip."
